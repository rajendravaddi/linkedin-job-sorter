<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn Job Sorter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="header-top">
        <div class="header-actions">
          <button id="btn-refresh" aria-label="Refresh LinkedIn page and reload jobs">Refresh</button>
          <button id="btn-fetch-more" class="btn-fetch-more" style="display:none" aria-label="Fetch next 10 pages">Fetch More</button>
        </div>
        <div id="job-count" class="job-count"></div>
      </div>
      <div id="notice" class="notice" aria-live="polite"></div>
      <div id="crawl-progress-container" class="crawl-progress-container" style="display:none">
        <div class="crawl-progress-bar">
          <div id="crawl-progress-fill" class="crawl-progress-fill"></div>
        </div>
        <div id="crawl-progress-label" class="crawl-progress-label"></div>
      </div>
    </header>

    <div class="controls" id="controls">
      <input type="text" id="filter-query" placeholder="Filter by title or company" aria-label="Filter by title or company">

      <label class="checkbox-label">
        <input type="checkbox" id="filter-hide-viewed"> Hide viewed
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="filter-hide-applied"> Hide applied
      </label>
      <label class="checkbox-label" id="easy-apply-label" style="display:none">
        <input type="checkbox" id="filter-easy-apply"> Easy Apply only
      </label>
    </div>

    <div id="status" class="status" aria-live="polite"></div>
    <div id="job-list" class="job-list" role="list"></div>
  </div>

  <script src="../shared/messages.js"></script>
  <script src="../lib/posted-time-parser.js"></script>
  <script src="../lib/search-context.js"></script>
  <script src="../lib/deduplicate-jobs.js"></script>
  <script src="../lib/job-sorter.js"></script>
  <script src="../lib/job-filter.js"></script>
  <script src="popup.js"></script>
</body>
</html>
