<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn Job Sorter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="header-top">
        <div class="header-actions">
          <button id="btn-refresh" aria-label="Refresh LinkedIn page and reload jobs">Refresh</button>
          <button id="btn-fetch-more" class="btn-fetch-more" style="display:none" aria-label="Fetch next 10 pages">Fetch More</button>
        </div>
        <div id="job-count" class="job-count"></div>
      </div>
      <div id="notice" class="notice" aria-live="polite"></div>
      <div id="crawl-progress-container" class="crawl-progress-container" style="display:none">
        <div class="crawl-progress-bar">
          <div id="crawl-progress-fill" class="crawl-progress-fill"></div>
        </div>
        <div id="crawl-progress-label" class="crawl-progress-label"></div>
      </div>
    </header>

    <div class="controls" id="controls">
      <div class="search-row">
        <input type="text" id="filter-query" placeholder="Filter by title or company" aria-label="Filter by title or company">
        <button type="button" id="btn-toggle-filters" class="btn-toggle-filters" aria-expanded="false" aria-controls="collapsible-filters" aria-label="Toggle filters">
          <span>Filters</span>
          <span id="active-filter-badge" class="filter-badge" style="display:none">0</span>
          <span id="filter-arrow" class="filter-arrow" aria-hidden="true">▼</span>
        </button>
      </div>

      <div id="collapsible-filters" class="collapsible-filters" style="display:none">
        <!-- Subsection 1: Apply process -->
        <div class="filter-subsection">
          <div class="filter-subsection-title">Apply process</div>
          <div class="filter-subsection-chips">
            <label class="checkbox-label">
              <input type="checkbox" id="filter-easy-apply"> Easy Apply
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="filter-external-site"> External site
            </label>
          </div>
        </div>

        <!-- Subsection 2: Hide -->
        <div class="filter-subsection">
          <div class="filter-subsection-title">Hide</div>
          <div class="filter-subsection-chips">
            <label class="checkbox-label">
              <input type="checkbox" id="filter-hide-viewed"> Viewed jobs
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="filter-hide-applied"> Applied jobs
            </label>
          </div>
        </div>

        <!-- Subsection 3: Filter companies -->
        <div class="filter-subsection">
          <div class="filter-subsection-header">
            <div class="filter-subsection-title">Filter companies</div>
            <div class="company-action-buttons">
              <button type="button" id="btn-select-all-companies" class="btn-company-action">Select all</button>
              <button type="button" id="btn-deselect-all-companies" class="btn-company-action">Deselect all</button>
            </div>
          </div>
          <div id="company-filter-list" class="company-filter-list" role="group" aria-label="Filter by company"></div>
        </div>
      </div>
    </div>

    <div id="status" class="status" aria-live="polite"></div>
    <div id="job-list" class="job-list" role="list"></div>
  </div>

  <script src="../shared/messages.js"></script>
  <script src="../lib/posted-time-parser.js"></script>
  <script src="../lib/search-context.js"></script>
  <script src="../lib/deduplicate-jobs.js"></script>
  <script src="../lib/job-sorter.js"></script>
  <script src="../lib/job-filter.js"></script>
  <script src="popup.js"></script>
</body>
</html>
